<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1 id="site-title">Tienda Demo</h1>
    <nav>
      <a href="#home" class="nav-link">Inicio</a>
      <a href="#productos" class="nav-link">Productos</a>
      <a href="#contacto" class="nav-link">Contacto</a>
    </nav>
  </header>

  <main class="container">
    <section id="home" class="mb-24">
      <h2 class="section-title">Bienvenido</h2>
      <p class="lead">
        Esta es una tienda de ejemplo. Explora nuestros productos destacados.
      </p>
      <button class="btn btn-success">
        Ver ofertas
      </button>
    </section>

    <section id="productos" class="grid-2 mb-24">
      <article class="card">
        <h3 class="card-title">Camiseta</h3>
        <p class="card-text">Algodón 100%, varias tallas.</p>
        <span class="badge">$199</span>
      </article>

      <article class="card">
        <h3 class="card-title">Sudadera</h3>
        <p class="card-text">Cómoda y abrigadora.</p>
        <span class="badge">$399</span>
      </article>
    </section>

    <section id="contacto" class="mb-24">
      <h2 class="section-title">Contacto</h2>
      <a href="mailto:info@tienda.demo" class="contact-link">Escríbenos</a>
    </section>
  </main>

  <footer>
    <small>&copy; 2025 Tienda Demo</small>
  </footer>
</body>
</html>
